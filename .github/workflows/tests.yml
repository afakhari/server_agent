name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app.py sentinel
      - name: Test (no Liara credentials)
        env:
          SENTINEL_DB_PATH: /tmp/sentinel_ci_test.sqlite3
          SENTINEL_ALLOW_LIVE_WRITES: 'false'
        run: python -m pytest -q
