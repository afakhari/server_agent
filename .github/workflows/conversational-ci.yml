name: Conversational Workspace Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate a reproducible frontend lockfile when missing
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            cd frontend
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            cd ..
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              git add frontend/package-lock.json
              git -c user.name=github-actions -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "build: commit frontend dependency lockfile"
              git push origin HEAD:main
            fi
          fi
      - name: Build conversational frontend
        run: cd frontend && npm ci --no-audit --no-fund && npm run build
